# Scoped, expiring Trivy ignores for the Docker base image.
#
# Every CVE below is an OS-level package in the base image (perl, ncurses, sqlite3,
# systemd/udev, gzip, acl, util-linux/mount tooling, pcre2) that cost-guard-mcp's own
# Python code never invokes - this is a pure stdio MCP server with no persistence layer,
# no shell-outs, and no PCRE-linked dependency (Python's `re` module has its own regex
# engine, not libpcre2). Debian has already published fixes for all of these in
# bookworm/trixie-security; the upstream ghcr.io/astral-sh/uv image simply has not
# rebuilt to pick them up yet (confirmed 2026-09-18 - astral-sh's images only rebuild as
# a side effect of a new uv release, not on the OS package's own patch cycle, and
# python3.12-bookworm-slim specifically no longer appears in astral-sh's own published
# image catalog).
#
# Expiry forces a re-check rather than a silent permanent blind spot - if this file is
# still needed past its expiry date, re-verify the same reasoning still holds (a new
# rebuild may have already picked up the fixes) rather than just pushing the date out.

vulnerabilities:
  - id: CVE-2025-69720
    statement: "ncurses - unused by cost-guard-mcp, no interactive terminal UI"
    expired_at: 2026-11-15
  - id: CVE-2026-11822
    statement: "libsqlite3-0 (OS package) - cost-guard-mcp has no persistence layer, never uses sqlite"
