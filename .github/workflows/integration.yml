# .github/workflows/integration.yml
name: integration
on:
  workflow_dispatch:
    inputs:
      include_snowflake:
        description: "Also run the Snowflake live job (needs a paid Snowflake account in live-integration)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
permissions:
  contents: read
jobs:
  bigquery:
    runs-on: ubuntu-latest
    environment: live-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - run: uv sync
      - name: Write BigQuery service-account key
        run: |
          umask 077
          echo "$BIGQUERY_SA_KEY_JSON" > /tmp/bq-sa.json
          chmod 600 /tmp/bq-sa.json
        env:
          BIGQUERY_SA_KEY_JSON: ${{ secrets.BIGQUERY_SA_KEY_JSON }}
      - run: uv run pytest tests/integration/test_bigquery_live.py -v -rA
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/bq-sa.json
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
  snowflake:
    # Opt-in: the Snowflake free trial ended and there is no paid plan for now (DECISIONS.md #9),
    # so neither the weekly schedule nor a bare dispatch runs this job.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_snowflake }}
    runs-on: ubuntu-latest
    environment: live-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - run: uv sync
      - name: Write Snowflake private key
        run: |
          umask 077
          echo "$SNOWFLAKE_PRIVATE_KEY" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      - run: uv run pytest tests/integration/test_snowflake_live.py -v
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
