# .github/workflows/audit.yml
#
# Dependency vulnerability scan. Deliberately NOT a required branch-protection
# check: a new CVE in an already-approved, unrelated dependency shouldn't block
# an unrelated PR (e.g. a docs fix) from merging - see this repo's own
# solo-maintainer branch-protection design. Runs on every push/PR for
# visibility, plus weekly since new CVEs are disclosed independent of code
# changes here. uv's own native `uv audit` is still preview/unstable as of
# this writing, so this uses the proven `uv export` -> pinned pip-audit
# pattern instead.
name: audit
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - run: uv export --no-hashes --format requirements-txt -o requirements.txt
      # PYSEC-2026-4114 (CVE-2026-49265) and PYSEC-2026-4113 (CVE-2026-49264), both
      # oauthlib <4.0.0: a PKCE code_verifier timing attack and a JSONP callback
      # injection in RevocationEndpoint - both on the OAuth *authorization-server* side.
      # This project is only an OAuth client (Databricks M2M via databricks-sdk) and
      # never executes oauthlib's server endpoints; the fix,
      # oauthlib 4.0.0, is pinned out by databricks-sql-connector (oauthlib<4.0.0 through
      # its current 4.6.0), so no lock bump can reach it. Accepted 2026-10-10 so this
      # check stays meaningful for the next real advisory. Re-check by 2026-12-01: drop the
      # ignores as soon as databricks-sql-connector allows oauthlib>=4 (uv lock
      # --upgrade-package oauthlib will then move it), or re-justify here. 4113 is
      # listed pre-emptively: Scorecard's OSV check already reports it, pip-audit's
      # PyPI feed had not picked it up yet on 2026-10-10.
      - run: uvx pip-audit@2.10.1 --requirement requirements.txt --ignore-vuln PYSEC-2026-4114 --ignore-vuln PYSEC-2026-4113
