# .github/workflows/audit.yml
#
# Dependency vulnerability scan. Deliberately NOT a required branch-protection
# check: a new CVE in an already-approved, unrelated dependency shouldn't block
# an unrelated PR (e.g. a docs fix) from merging - see this repo's own
# solo-maintainer branch-protection design. Runs on every push/PR for
# visibility, plus weekly since new CVEs are disclosed independent of code
# changes here. uv's own native `uv audit` is still preview/unstable as of
# this writing, so this uses the proven `uv export` -> pinned pip-audit
# pattern instead.
name: audit
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - run: uv export --no-hashes --format requirements-txt -o requirements.txt
      # No --ignore-vuln flag: every advisory pip-audit reports is a finding to fix by
      # relocking (uv lock --upgrade-package <name>) or to justify in the PR that adds an
      # ignore. The oauthlib acceptances (PYSEC-2026-4114 / -4113, an authorization-server
      # path this OAuth client never runs) were retired when the lock moved to oauthlib 4.0.0
      # via databricks-sql-connector 4.8.0. tests/unit/test_release_metadata.py fails if an
      # ignore comes back without changing that test.
      - run: uvx pip-audit@2.10.1 --requirement requirements.txt
