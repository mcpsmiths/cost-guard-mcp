# .github/workflows/tests.yml
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      # --all-groups (not plain `uv sync`): the `otel` dependency-group is deliberately not
      # in tool.uv's default-groups (production/Docker never installs it), but the unit
      # suite has a real-import test for it (test_server.py's
      # test_bootstrap_opentelemetry_registers_a_tracer_provider_when_endpoint_is_set), so
      # this job specifically needs it present.
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest tests/unit -v --cov=cost_guard_mcp --cov-report=term-missing --cov-fail-under=80
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cost-guard-mcp:ci
      - name: Scan built image for known CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: cost-guard-mcp:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
      - name: Smoke test the built image via the real MCP client
        run: |
          uv run python -c "
          import asyncio
          from mcp import StdioServerParameters
          from mcp.client.session import ClientSession
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command='docker', args=['run', '-i', '--rm', 'cost-guard-mcp:ci'])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = {t.name for t in tools.tools}
                      assert names == {'check_credentials', 'describe_engine_capabilities', 'estimate_query_cost', 'run_query_bounded'}, names
                      result = await session.call_tool('describe_engine_capabilities', {'engine': 'bigquery'})
                      assert result.structured_content['engine'] == 'bigquery'
          asyncio.run(main())
          "
