# .github/workflows/release.yml
#
# Triggered by pushing a version tag (git tag vX.Y.Z && git push origin vX.Y.Z).
# Publishes to PyPI via Trusted Publishing (OIDC) - no stored API token. `uv
# publish` has this built in natively; no twine or pypa/gh-action-pypi-publish
# needed. See DECISIONS.md for why this replaced the earlier manual-token flow.
#
# One-time setup required on PyPI (not done by this workflow): on
# pypi.org -> cost-guard-mcp project -> Settings -> Publishing -> Add a new
# publisher, with:
#   Owner: mcpsmiths
#   Repository name: cost-guard-mcp
#   Workflow name: release.yml
#   Environment name: pypi
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the ancestry check below needs origin/main's commits, not just
          # the tag's own commit that the default shallow checkout provides.
          fetch-depth: 0
      # Defence in depth, not the authorization control: the tag pusher controls this
      # file at the tagged commit, so what actually binds release authority is the tag
      # ruleset, the `pypi` environment's tag-only deployment policy and PyPI's publisher
      # binding to that environment - see DECISIONS.md #10. HEAD^{commit} rather than
      # $GITHUB_SHA because the release tags are annotated and $GITHUB_SHA may be the tag
      # object itself; peeling it ourselves keeps the comparison independent of git's
      # version-specific handling of tag objects in merge-base.
      # The comparison uses the fully qualified refs/remotes/origin/main on purpose:
      # fetch-depth: 0 also fetches +refs/tags/*:refs/tags/*, so a pusher who adds a tag
      # literally named `origin/main` at the unreviewed commit makes the bare refname
      # ambiguous and git resolves it to the tag (refs/tags/ wins over refs/remotes/) -
      # found by runtime verification of PR #86 and pinned by
      # tests/unit/test_release_metadata.py.
      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main
          MAIN_REF=refs/remotes/origin/main
          if ! git rev-parse --verify --quiet "$MAIN_REF^{commit}" >/dev/null; then
            echo "$MAIN_REF is not available after fetch - refusing to release"
            exit 1
          fi
          TAGGED_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" "$MAIN_REF"; then
            echo "Tag $GITHUB_REF_NAME at $TAGGED_COMMIT is not an ancestor of origin/main - release tags must point at reviewed, merged history"
            exit 1
          fi
      # server.json is also what the MCP Registry listing is published from (DECISIONS.md
      # #12), so the gate covers the package record a registry consumer actually installs
      # from - packages[0].version/identifier/registryType - not only the top-level version.
      # Mirrored by tests/unit/test_release_metadata.py, which runs this script verbatim.
      - name: Verify tag matches pyproject.toml and server.json (top level and package record)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PYPROJECT_NAME=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          SERVER_JSON_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          PACKAGE_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          PACKAGE_IDENTIFIER=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['identifier'])")
          PACKAGE_REGISTRY=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['registryType'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ] || [ "$TAG_VERSION" != "$SERVER_JSON_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION pyproject.toml=$PYPROJECT_VERSION server.json=$SERVER_JSON_VERSION server.json packages[0]=$PACKAGE_VERSION"
            exit 1
          fi
          if [ "$PACKAGE_REGISTRY" != "pypi" ] || [ "$PACKAGE_IDENTIFIER" != "$PYPROJECT_NAME" ]; then
            echo "Package record mismatch: server.json packages[0] is $PACKAGE_REGISTRY/$PACKAGE_IDENTIFIER, expected pypi/$PYPROJECT_NAME"
            exit 1
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - run: uv build
      # uv's cyclonedx1.5 export is experimental per uv's own warning (verified
      # 2026-09-13) and may change without notice in a future uv release -
      # harmless if it does, since this is a separate step from uv build/publish.
      - run: uv export --no-hashes --format cyclonedx1.5 -o sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: |
            dist/
            sbom.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
      # Generates PEP 740 digital attestations for the sdist/wheel so they're
      # uploaded to PyPI alongside the distribution. `uv publish` on its own
      # only uploads pre-existing sidecar files - it does not create them.
      - uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027  # v0.0.6
      - run: uv publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
      # SLSA build provenance for the published distributions. The bundle
      # this produces is renamed to *.intoto.jsonl below and attached as a
      # release asset - that filename is what OpenSSF Scorecard's
      # Signed-Releases check looks for among release assets.
      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Rename provenance attestation for Signed-Releases detection
        run: cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* sbom.json provenance.intoto.jsonl

  # The MCP Registry listing io.github.mcpsmiths/cost-guard-mcp is published from this same
  # tagged commit once PyPI has the version (DECISIONS.md #12; it replaces the manual
  # device-flow publish from a personal host). The reusable workflow declares the
  # `mcp-registry` environment and the tag-pinned checkout; this caller grants exactly the
  # permissions a listing publish needs and nothing it does not (no contents: write).
  registry-publish:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry-publish.yml
    with:
      tag: ${{ github.ref_name }}
