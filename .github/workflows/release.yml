# .github/workflows/release.yml
#
# Triggered by pushing a version tag (git tag vX.Y.Z && git push origin vX.Y.Z).
# Publishes to PyPI via Trusted Publishing (OIDC) - no stored API token. `uv
# publish` has this built in natively; no twine or pypa/gh-action-pypi-publish
# needed. See DECISIONS.md for why this replaced the earlier manual-token flow.
#
# One-time setup required on PyPI (not done by this workflow): on
# pypi.org -> cost-guard-mcp project -> Settings -> Publishing -> Add a new
# publisher, with:
#   Owner: mcpsmiths
#   Repository name: cost-guard-mcp
#   Workflow name: release.yml
#   Environment name: pypi
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify tag matches pyproject.toml and server.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SERVER_JSON_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ] || [ "$TAG_VERSION" != "$SERVER_JSON_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION pyproject.toml=$PYPROJECT_VERSION server.json=$SERVER_JSON_VERSION"
            exit 1
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv build
      # uv's cyclonedx1.5 export is experimental per uv's own warning (verified
      # 2026-09-13) and may change without notice in a future uv release -
      # harmless if it does, since this is a separate step from uv build/publish.
      - run: uv export --no-hashes --format cyclonedx1.5 -o sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: |
            dist/
            sbom.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
      - run: uv publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/* sbom.json
