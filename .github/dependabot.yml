version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # snowflake-connector-python 5.x is a public preview published under a plain version
      # number; the project caps the range below 5 until Snowflake ships a GA 5.x (#121).
      - dependency-name: "snowflake-connector-python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # .github/requirements-build.txt - the hash-pinned backend the release build installs
  # (DECISIONS.md #11, amended 2026-10-16). Dependabot rewrites the version and the --hash
  # lines together; tests/unit/test_release_metadata.py then fails that PR until
  # pyproject.toml's [build-system] pin, build-constraint-dependencies and uv.lock move
  # with it - intended coupling, not a flake.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    groups:
      build-requirements:
        patterns: ["*"]
