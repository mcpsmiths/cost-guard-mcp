[project]
name = "cost-guard-mcp"
version = "0.1.0"
description = "Pre-flight query cost & result-size guardrails for AI agents across BigQuery and Snowflake"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.0.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigquery-reservation>=1.15.0",
    "snowflake-connector-python>=3.12.0",
    "pydantic>=2.9.0",
]

[project.scripts]
cost-guard-mcp = "cost_guard_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_guard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
